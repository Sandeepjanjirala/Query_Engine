<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Branch Query Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      cursor: pointer;
    }

    pre {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Branch Query Engine</h1>

  <p>
    Current pre-function:
    <strong>Top 5 branches with highest dropout percentage</strong>
  </p>

  <textarea id="question">Show top 5 branches with highest dropout percentage</textarea>

  <br>

  <button id="ask">Ask</button>

  <pre id="result">Waiting...</pre>


  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>

    $(document).ready(function () {

      $("#ask").on("click", function () {

        var question = $("#question").val();
        var $result = $("#result");

        $result.text("Loading...");

        $.ajax({
          url: "/api/query/",
          type: "POST",
          contentType: "application/json",

          data: JSON.stringify({
            question: question
          }),

          success: function (data) {

            if (data.answer) {
              $result.text(data.answer);
            } else {
              $result.text(
                JSON.stringify(data, null, 2)
              );
            }

          },

          error: function (xhr) {

            var message = "Request failed.";

            if (xhr.responseJSON && xhr.responseJSON.error) {
              message = xhr.responseJSON.error;
            } else if (xhr.responseText) {
              message = xhr.responseText;
            }

            $result.text(message);
          }

        });

      });

    });

  </script>

</body>
</html>
